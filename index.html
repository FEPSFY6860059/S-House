<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Clock-In Portal</title>
  
  <link rel="manifest" href="manifest.json">
  
  <link rel="stylesheet" href="style.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    
    <div id="login-card" class="card">
      <h2>Employee Login</h2>
      <form id="login-form">
        <input type="text" id="employee-id" placeholder="Enter Employee ID" required />
        <button type="submit" class="btn">Log In</button>
      </form>
    </div>

    <div id="dashboard-card" class="card hidden">
      <div class="header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2 id="welcome-msg" style="margin:0;">Welcome</h2>
        <button id="logout-btn" class="btn-secondary">Logout</button>
      </div>

      <div class="clock-section">
        <p id="live-clock">00:00:00 AM</p>
        <p id="status-text">Status: <strong>Clocked Out</strong></p>
        <button id="toggle-clock-btn" class="btn btn-clock">Clock In</button>
      </div>

      <div class="schedule-section card" style="margin-top: 20px; text-align: left; background: #ffffff; border: 1px solid #e2e8f0; padding: 16px; border-radius: 12px;">
        <h3 id="roster-title" style="margin-bottom: 4px; margin-top:0;">Weekly Schedule</h3>
        <p id="roster-updated" style="font-size: 12px; color: #64748b; margin-top: 0; margin-bottom: 12px;">No schedule posted yet.</p>

        <div id="roster-content" style="margin: 12px 0;"></div>

        <div id="admin-schedule-box" class="hidden" style="margin-top: 16px; padding-top: 16px; border-top: 2px dashed #e2e8f0;">
          <h4 style="margin-top: 0; color: #10b981;">Manager Tool: Update Schedule</h4>
          
          <label style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px;">Week Title</label>
          <input type="text" id="admin-title-input" placeholder="e.g. Schedule: July 27 - Aug 2" style="width: 100%; box-sizing: border-box; margin-bottom: 12px;" />

          <label style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px;">Schedule Text OR Image Link</label>
          <textarea id="admin-content-input" rows="4" placeholder="Type text schedule OR paste image URL here..." style="width: 100%; padding: 10px; border-radius: 8px; border: 2px solid #e2e8f0; font-family: inherit; margin-bottom: 12px; box-sizing: border-box;"></textarea>

          <button id="publish-roster-btn" class="btn" style="background-color: #0f172a;">Publish Schedule</button>
        </div>
      </div>

      <h3 style="margin-top: 24px;">Shift Log</h3>
      <table id="logs-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Clock In</th>
            <th>Clock Out</th>
            <th>Total Hours</th>
          </tr>
        </thead>
        <tbody id="logs-body">
          </tbody>
      </table>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
