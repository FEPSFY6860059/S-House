<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Portal</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app-container">
    
    <div id="login-card" class="card">
      <h2>Employee Login</h2>
      <form id="login-form">
        <input type="text" id="employee-id" placeholder="Enter Employee ID" required />
        <button type="submit" class="btn">Log In</button>
      </form>
    </div>

    <div id="dashboard-card" class="hidden">
      
      <header class="app-header">
        <span id="welcome-msg">Welcome</span>
        <button id="logout-btn" class="btn-logout">Logout</button>
      </header>

      <main id="tab-clockin" class="tab-content active">
        <div class="card clock-card">
          <p id="live-clock">00:00:00 AM</p>
          <p id="status-text">Status: <strong>Clocked Out</strong></p>
          <button id="toggle-clock-btn" class="btn btn-clock">Clock In</button>
        </div>

        <div class="card logs-card">
          <h3>Your Shift History</h3>
          <table id="logs-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>In</th>
                <th>Out</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody id="logs-body">
              </tbody>
          </table>
        </div>
      </main>

<main id="tab-timetable" class="tab-content hidden">
        <div class="card schedule-card">
          <h3 id="roster-title">Weekly Schedule</h3>
          <p id="roster-updated" class="subtext">Loading schedule...</p>

          <div class="table-container">
            <table id="roster-table">
              <thead>
                <tr>
                  <th>Day</th>
                  <th>Shift / Staff Scheduled</th>
                </tr>
              </thead>
              <tbody id="roster-table-body">
                </tbody>
            </table>
          </div>

          <div id="admin-schedule-box" class="admin-box hidden">
            <h4>Manager Tool: Update Schedule</h4>
            
            <label>Week Title</label>
            <input type="text" id="admin-title-input" placeholder="e.g. Schedule: July 27 - Aug 2" />

            <label>Schedule Details (One day per line, e.g., Mon: Melissa 9-5)</label>
            <textarea id="admin-content-input" rows="7" placeholder="Mon: Melissa & Bella (9am-5pm)&#10;Tue: Kelly & Henry (12pm-8pm)&#10;Wed: Jacob (9am-5pm)&#10;Thu: OFF&#10;Fri: Melissa (9am-5pm)&#10;Sat: Bella (10am-4pm)&#10;Sun: OFF"></textarea>

            <button id="publish-roster-btn" class="btn btn-dark">Publish Schedule</button>
          </div>
        </div>
      </main>

      <nav class="bottom-nav">
        <button id="nav-clockin" class="nav-btn active">
          <span class="nav-icon">⏰</span>
          <span class="nav-label">Clock In</span>
        </button>
        <button id="nav-timetable" class="nav-btn">
          <span class="nav-icon">📅</span>
          <span class="nav-label">Timetable</span>
        </button>
      </nav>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
