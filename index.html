<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>S-House Portal</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="app-container">
    
    <div id="login-card" class="card">
      <div class="brand-header">
        <h1>S-House</h1>
        <p>Staff Portal</p>
      </div>

      <form id="login-form">
        <label for="employee-id">Employee ID</label>
        <input type="password" id="employee-id" placeholder="Enter your ID" required>
        <button type="submit" class="btn btn-primary">Login</button>
      </form>
    </div>

    <div id="dashboard-card" class="card hidden">
      
      <div class="dashboard-header">
        <span id="welcome-msg">Welcome, Employee</span>
        <button id="logout-btn" class="btn-text">Logout</button>
      </div>

      <nav class="tab-nav">
        <button id="nav-clockin" class="tab-btn active">Clock In</button>
        <button id="nav-timetable" class="tab-btn">Schedule</button>
      </nav>

      <main id="tab-clockin" class="tab-content">
        
        <div class="clock-box">
          <div id="live-clock">00:00:00 AM</div>
          <div id="status-text" class="status">Status: <strong>Clocked Out</strong></div>
          <button id="toggle-clock-btn" class="btn btn-clock">Clock In</button>
        </div>

        <div class="logs-section">
          <h3>Your Recent Shifts</h3>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>In</th>
                  <th>Out</th>
                  <th>Total</th>
                </tr>
              </thead>
              <tbody id="logs-body">
                </tbody>
            </table>
          </div>
        </div>

        </main>

      <main id="tab-timetable" class="tab-content hidden">
        
        <div class="roster-header-box">
          <h2 id="roster-title">Weekly Schedule</h2>
          <span id="roster-updated" class="subtext">Updated: --</span>
        </div>

        <div class="table-container">
          </div>
